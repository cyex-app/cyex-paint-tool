<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paint editor - cyex paints</title>
  <meta name="description" content="Build static and animated 7TV name paints. Export 7TV JSON, CSS, PNG, GIF and APNG. Runs entirely in your browser.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1e1f23">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try { if (localStorage.getItem('cyexTheme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
      document.documentElement.classList.add('js');
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#editor">Skip to editor</a>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="https://cyex.app" aria-label="cyex home">
        <svg class="mark" viewBox="3 5 25 22" width="22" height="19" aria-hidden="true">
          <rect x="3" y="5" width="15" height="6" fill="var(--mark-ink)"/>
          <rect x="10" y="13" width="18" height="6" fill="var(--accent)"/>
          <rect x="3" y="21" width="15" height="6" fill="var(--mark-ink)"/>
        </svg>
        <span>cyex paints</span>
      </a>
      <div class="seg" id="modeSeg" role="radiogroup" aria-label="Paint type"></div>
      <div class="topbar-tools">
        <button class="btn secondary small" id="undoBtn" type="button" data-tip="Undo" data-hint="Ctrl+Z" aria-label="Undo"></button>
        <button class="btn secondary small" id="redoBtn" type="button" data-tip="Redo" data-hint="Ctrl+Shift+Z" aria-label="Redo"></button>
        <button class="btn secondary" id="presetsBtn" type="button"></button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme" data-tip="Switch theme"></button>
      </div>
    </div>
  </header>

  <h1 class="sr-only">cyex paints: 7TV name paint editor</h1>
  <main class="wrap layout">
    <section class="editor" id="editor" aria-label="Editor" tabindex="-1"></section>
    <aside class="stage" id="stage" aria-label="Preview and export"></aside>
  </main>

  <footer class="footer">
    <div class="wrap footer-in">
      <span>Everything runs in your browser. Nothing is uploaded.</span>
      <span>Not affiliated with, endorsed by, or sponsored by 7TV or Twitch.</span>
    </div>
  </footer>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="toasts errors" id="errors" aria-live="assertive"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script src="js/core.js" data-engine></script>
  <script src="js/fx.js" data-engine></script>
  <script src="js/paint.js" data-engine></script>
  <script src="js/encode.js" data-engine></script>
  <script src="js/library.js" data-engine></script>
  <script src="js/more.js" data-engine></script>
  <script src="js/elements.js" data-engine></script>
  <script src="js/engine.js" data-engine></script>
  <script src="js/presets.js" data-engine></script>
  <script src="js/ui.js"></script>
  <script src="js/app/store.js"></script>
  <script src="js/app/namepaint.js"></script>
  <script src="js/app/editors.js"></script>
  <script src="js/app/anim-editor.js"></script>
  <script src="js/app/playback.js"></script>
  <script src="js/app/export.js"></script>
  <script src="js/app/dialogs.js"></script>
  <script src="js/app/main.js"></script>
</body>
</html>
