  <style>
/* cyex app tokens: the desktop app (cyex deck) and dense web tools (cyex logs, request, VOD finder).
   Palette is shared value for value between cyex deck (ui/src/design/tokens.css) and cyex logs
   (svelte/index.html). Accent tokens are the cyex-design set. Use only these values. */

:root,
.theme-dark {
  color-scheme: dark;

  /* One flat warm-neutral grey, not black: the content is a wall of text and a shaded backdrop
     competes with it. Surfaces are opaque steps up, so a panel over a panel still reads. */
  --bg: #1e1f23;
  --surface: #26272c;
  --surface-hover: #2d2e34;
  --elevated: #2f3037;   /* popovers, menus, dialogs: a step wide enough to read as height */
  --elevated-2: #353640; /* tooltips, tiles inside a popover */
  --border: #34353c;
  --border-strong: #43454d;
  --text: #e8e8ea;
  --muted: #b4b5bb;
  --dim: #9fa1a9;
  --neutral-chip: #34353c;
  --row-hover: rgba(255, 255, 255, .035);
  --row-alt: rgba(255, 255, 255, .015);
  --shadow: rgba(0, 0, 0, .35);
  --overlay: rgba(14, 15, 18, .6);

  --accent: #145aff;
  --accent-2: #2a6aff;
  --accent-text: #7ea4ff;
  --accent-ink: #ffffff;
  --accent-dim: rgba(20, 90, 255, .14);
  --accent-wash: rgba(20, 90, 255, .22);
  --accent-border: rgba(20, 90, 255, .55);

  --red: #ff6b6b;
  --yellow: #ffb545;
  --green: #33d68f;
  --cyan: #4fd6ff;
  --pink: #ff7bd5;
  --purple: #b083ff;
  --gold: #ffd45e;
  --twitch: #a970ff;
  --live: #e91916;
  --danger-solid: #e81123;

  --shadow-pop: 0 8px 24px var(--shadow);
  --shadow-dialog: 0 16px 48px var(--shadow);
  /* The one keyboard focus colour: the text colour. The accent marks what's selected,
     and a user's accent can be too faint to see. */
  --focus-ring: var(--text);
}

:root {
  /* Theme-independent */
  --kick: #53fc18;
  --twitch-logo: #9146ff;
  --on-solid: #ffffff;          /* text on --live / --danger-solid */
  --on-video: #ffffff;          /* video and pictures stay dark in both themes */
  --on-video-dim: #dddddd;
  --scrim: rgba(0, 0, 0, .55);
  --scrim-strong: rgba(0, 0, 0, .72);

  --font-ui: 'IBM Plex Sans', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Cascadia Mono', ui-monospace, Consolas, monospace;

  /* Desktop density (13px base). Web tools set body to .87rem on a 16px root instead. */
  --text-base: 13px;
  --text-sub: .85rem;
  --text-hint: .78rem;
  --text-label: .68rem;

  /* The shared cyex page wrapper (cyex-design), for web tools; the desktop app fills its window. */
  --page-max: 1520px;
  --page-pad: 20px;
  --measure: 820px;
  --measure-form: 640px;

  --radius: 3px;
  --radius-sm: 2px;
  --radius-pill: 999px;  /* switch tracks and count badges only */
  --chrome-h: 38px;

  /* Motion: hovers and small state changes, things that appear, things that travel. */
  --fast: .12s;
  --base: .2s;
  --slow: .36s;
  --ease: cubic-bezier(.16, 1, .3, 1);

  /* Stacking, low to high. Raw 1-9 stay inside a component. */
  --z-panel: 10;
  --z-popover: 300;
  --z-dialog: 320;
  --z-menu: 350;
  --z-tooltip: 390;
  --z-toast: 600;
}

:root[data-theme='light'],
.theme-light {
  color-scheme: light;
  --bg: #f3f3f4;
  --surface: #ffffff;
  --surface-hover: #f6f6f7;
  --elevated: #ffffff;
  --elevated-2: #f4f4f6;
  --border: #dcdde1;
  --border-strong: #c4c6cc;
  --text: #1b1c20;
  --muted: #4f515a;
  --dim: #6b6d76;        /* not a mirror: a straight flip lands near 2.9:1 on white */
  --neutral-chip: #e6e7ea;
  --row-hover: rgba(20, 22, 30, .035);
  --row-alt: rgba(20, 22, 30, .015);
  --shadow: rgba(20, 22, 30, .12);
  --overlay: rgba(243, 243, 244, .7);

  --accent: #14e6ff;
  --accent-2: #10c9e6;
  --accent-text: #046a82;
  --accent-ink: #00232b;
  --accent-dim: rgba(4, 106, 130, .08);
  --accent-wash: rgba(4, 106, 130, .16);
  --accent-border: rgba(4, 106, 130, .4);

  /* Darkened rather than mirrored: the dark pastels sit at 2-3:1 on white. */
  --red: #c1352f;
  --yellow: #9a5c05;
  --green: #0f8a55;
  --cyan: #0b6d8a;
  --pink: #a82277;
  --purple: #6b34c9;
  --gold: #7d5a00;
  --twitch: #772ce8;
  --live: #d9120f;
  --danger-solid: #c42b1c;

  --shadow-pop: 0 8px 24px var(--shadow);
  --shadow-dialog: 0 16px 48px var(--shadow);
  --focus-ring: var(--text);
}

/* Kick: the accent changes, nothing else. After the light block on purpose. */
[data-platform='kick'] {
  --accent: #45ca16; --accent-2: #3db313; --accent-text: #45ca16; --accent-ink: #0b2200;
  --accent-dim: rgba(69, 202, 22, .14); --accent-wash: rgba(69, 202, 22, .22); --accent-border: rgba(69, 202, 22, .55);
}
[data-platform='kick'][data-theme='light'] {
  --accent: #53fc18; --accent-2: #48e60a; --accent-text: var(--text);
  --accent-dim: rgba(83, 252, 24, .14); --accent-wash: rgba(83, 252, 24, .28); --accent-border: #53fc18;
}

/* ---- base ---- */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: var(--text-base)/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-text); }
::selection { background: var(--border-strong); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* Section label: the one uppercase text style. */
.label {
  font-size: var(--text-label);
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--dim);
}

/* Shared form field look. */
.field {
  height: 30px;
  padding: 0 10px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  outline: none;
  transition: border-color var(--fast);
}
.field:focus-visible { border-color: var(--focus-ring); box-shadow: 0 0 0 1px var(--focus-ring); }
.field::placeholder { color: var(--dim); }

/* Scrollbars: 11px, quiet. */
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border: 2px solid transparent; border-radius: var(--radius); background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--dim); }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* Web tools: header, main and footer content sit in this, so every page lines up. */
html { scrollbar-gutter: stable; }
.wrap { width: 100%; max-width: var(--page-max); margin-inline: auto; padding-inline: var(--page-pad); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
}
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 150ms; }

</style>
  <style>
/* cyex paints: web-tool density on the cyex app tokens. */
:root { --mark-ink: #e8e8ea; --chat-dark: #18181b; --chat-light: #ffffff; --chat-dark-text: #efeff1; --chat-light-text: #0e0e10; --checker-a: #2a2b31; --checker-b: #34353c; --name-font: 'Inter', 'Roobert', 'Segoe UI', system-ui, sans-serif; }
:root[data-theme='light'] { --mark-ink: #1b1c20; --checker-a: #e6e7ea; --checker-b: #f6f6f7; }

html { font-size: 16px; }
body { font-size: .87rem; line-height: 1.55; min-height: 100vh; display: flex; flex-direction: column; }
main { flex: 1; }
h1, h2, h3 { margin: 0; letter-spacing: 0; }
.skip { position: absolute; left: 8px; top: -40px; padding: 6px 10px; background: var(--elevated); border: 1px solid var(--border-strong); border-radius: var(--radius); z-index: var(--z-toast); }
.skip:focus { top: 8px; }

/* ---------- header ---------- */
.topbar { position: sticky; top: 0; z-index: var(--z-panel); background: var(--bg); border-bottom: 1px solid var(--border); }
.topbar-in { display: flex; align-items: center; gap: 16px; padding-block: 13px; }
.brand { display: inline-flex; align-items: center; gap: 9px; color: var(--text); text-decoration: none; font-weight: 700; font-size: 1.04rem; }
.brand:active { opacity: .6; transition: none; }
.topbar-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(340px, 520px) minmax(0, 1fr); gap: 20px; align-items: start; padding-top: 20px; padding-bottom: 60px; }
.editor, .stage { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.editor:focus { outline: none; }
.stage { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto; scrollbar-gutter: stable; padding-right: 2px; }
@media (max-width: 1000px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; max-height: none; overflow: visible; order: -1; }
}

/* ---------- panel ---------- */
.panel { background: var(--surface); border: 1px solid var(--border); container-type: inline-size; }
.panel > header { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--border); }
.panel > header h2 { flex: 1; font-size: .8rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel > header .count { font: 600 .74rem var(--font-mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.panel > .body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel .field, .panel .num { background: var(--bg); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack:empty { display: none; }
.hint { font-size: var(--text-hint); color: var(--dim); margin: 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.grow { flex: 1; min-width: 0; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@container (max-width: 380px) { .split { grid-template-columns: 1fr; } }
.sub { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.sub > .label { margin-bottom: -4px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 14px; border: 1px solid transparent; border-radius: var(--radius); font-size: .87rem; font-weight: 600; white-space: nowrap; cursor: pointer; background: none; color: var(--text); transition: background-color var(--fast), border-color var(--fast), color var(--fast); }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn.small { height: 27px; padding: 0 10px; font-size: .8rem; }
.btn.small svg { width: 14px; height: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { background: var(--accent-2); }
.btn.secondary { background: var(--surface); border-color: var(--border-strong); }
.btn.secondary:hover { background: var(--surface-hover); }
.btn.ghost { color: var(--muted); }
.btn.ghost:hover { background: var(--surface-hover); color: var(--text); }
.btn.danger { background: var(--surface); border-color: var(--border-strong); color: var(--red); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:not(:disabled):active { transform: scale(.97); }
.btn.block { width: 100%; }

.icon-btn { display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: var(--radius); background: transparent; color: var(--muted); cursor: pointer; flex: none; transition: background-color var(--fast), color var(--fast); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn:hover { background: var(--surface-hover); color: var(--text); }
.icon-btn:active { opacity: .6; transition: none; }
.icon-btn.active { background: var(--accent-dim); color: var(--accent-text); }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn.sm { width: 26px; height: 26px; }
.icon-btn.sm svg { width: 14px; height: 14px; }
.icon-btn.danger:hover { color: var(--red); }

/* ---------- segmented ---------- */
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.seg::-webkit-scrollbar { display: none; }
.seg button { height: 24px; padding: 0 10px; border: 0; border-radius: var(--radius-sm); background: none; color: var(--muted); font-size: .8rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: color var(--fast), background-color var(--fast); }
.seg button:hover { color: var(--text); }
.seg button[aria-checked='true'] { background: var(--accent-dim); color: var(--accent-text); }
.seg button:focus-visible { outline-offset: -2px; }
#modeSeg button { height: 28px; padding: 0 14px; font-size: .85rem; }

/* ---------- fields ---------- */
.ctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ctl > .top { display: flex; align-items: center; gap: 8px; min-height: 18px; }
.ctl > .top .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field { width: 100%; }
.field.mono, .num, textarea.code { font-family: var(--font-mono); }
.num { width: 64px; height: 26px; padding: 0 6px; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius); outline: none; font-size: .8rem; -moz-appearance: textfield; transition: border-color var(--fast); }
.num::-webkit-outer-spin-button, .num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.num:focus-visible { border-color: var(--focus-ring); box-shadow: 0 0 0 1px var(--focus-ring); }
.unit { color: var(--dim); font-size: .76rem; margin-left: -4px; }

input[type='range'] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; margin: 0; cursor: pointer; --p: 50%; }
input[type='range']::-webkit-slider-runnable-track { height: 4px; border-radius: var(--radius-sm); background: linear-gradient(to right, var(--accent) var(--p), var(--border-strong) var(--p)); }
input[type='range']::-moz-range-track { height: 4px; border-radius: var(--radius-sm); background: var(--border-strong); }
input[type='range']::-moz-range-progress { height: 4px; border-radius: var(--radius-sm); background: var(--accent); }
input[type='range']::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--text); border: 0; box-shadow: 0 0 0 3px var(--bg); }
input[type='range']::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--text); border: 0; box-shadow: 0 0 0 3px var(--bg); }
input[type='range']:focus-visible { outline: none; }
input[type='range']:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--focus-ring); }
input[type='range']:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--focus-ring); }

.check { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; min-height: 24px; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.check .box { width: 16px; height: 16px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg); display: grid; place-items: center; flex: none; transition: background-color var(--fast), border-color var(--fast); }
.check .box svg { width: 12px; height: 12px; color: var(--accent-ink); opacity: 0; }
.check input:checked + .box { background: var(--accent); border-color: var(--accent); }
.check input:checked + .box svg { opacity: 1; }
.check input:focus-visible + .box { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* custom select */
.select { position: relative; }
.select > button { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px 0 10px; text-align: left; background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius); cursor: pointer; transition: border-color var(--fast); }
.select > button span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.select > button svg { width: 14px; height: 14px; color: var(--dim); flex: none; }
.select > button:hover { border-color: var(--dim); }
.popover { position: fixed; z-index: var(--z-popover); min-width: 180px; max-width: min(480px, calc(100vw - 16px)); max-height: 320px; overflow: auto; padding: 4px; background: var(--elevated); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow-pop); transform-origin: top; animation: pop-in var(--base) var(--ease); }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.option { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 0 8px; border: 0; border-radius: var(--radius-sm); background: none; text-align: left; cursor: pointer; }
.option:hover { background: var(--row-hover); }
.option.kb { box-shadow: inset 0 0 0 1px var(--focus-ring); }
.option[aria-selected='true'] { background: var(--accent-dim); color: var(--accent-text); }
.option:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }

/* colour field */
.color { display: flex; align-items: center; gap: 6px; min-width: 0; }
.swatch { position: relative; width: 30px; height: 30px; flex: none; border: 1px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; cursor: pointer; background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 10px 10px; }
.swatch i { position: absolute; inset: 0; }
.swatch input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.swatch:focus-within { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.color .hex { width: 88px; height: 30px; padding: 0 8px; font-family: var(--font-mono); font-size: .8rem; text-transform: lowercase; }

/* ---------- stops editor ---------- */
.stops { display: flex; flex-direction: column; gap: 10px; }
.gbar { position: relative; height: 34px; margin: 0 7px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 12px 12px; cursor: copy; touch-action: none; }
.gbar .fill { position: absolute; inset: 0; border-radius: var(--radius-sm); }
.handle { position: absolute; top: -5px; width: 14px; height: 42px; margin-left: -7px; border: 2px solid var(--text); border-radius: var(--radius); box-shadow: 0 0 0 1px var(--bg); cursor: ew-resize; touch-action: none; padding: 0; }
.handle.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--bg), 0 0 0 3px var(--accent-border); z-index: 2; }
.stoplist { display: flex; flex-direction: column; border: 1px solid var(--border); }
.stoprow { display: grid; grid-template-columns: 20px auto 1fr auto auto auto; align-items: center; gap: 8px; padding: 6px 6px 6px 10px; border-bottom: 1px solid var(--border); }
.stoprow:last-child { border-bottom: 0; }
.stoprow.sel { box-shadow: inset 2px 0 0 var(--accent); background: var(--row-hover); }
.stoprow .idx { font: 600 .72rem var(--font-mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.stoprow .numwrap { display: flex; align-items: center; gap: 4px; }
.stoprow .num { width: 56px; }
@container (max-width: 400px) { .stoprow { grid-template-columns: 20px auto 1fr auto; } .stoprow .alpha { grid-column: 3; } }

/* shadows */
.shadow-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 8px; align-items: end; padding: 10px; border: 1px solid var(--border); }
.shadow-row .color { grid-column: 1 / 4; }

/* ---------- layers ---------- */
.list { display: flex; flex-direction: column; border: 1px solid var(--border); }
.item { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 4px 4px 8px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background-color var(--fast); }
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--row-hover); box-shadow: inset 2px 0 0 var(--border-strong); }
.item.sel { background: var(--accent-dim); box-shadow: inset 3px 0 0 var(--accent); }
.item.off .name { color: var(--dim); text-decoration: line-through; }
.item .thumb { width: 44px; height: 22px; flex: none; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 8px 8px; image-rendering: auto; }
.item .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.item .meta { font-size: .74rem; color: var(--dim); white-space: nowrap; }
.item .tools { display: flex; gap: 2px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 12px; color: var(--dim); text-align: center; }
.empty svg { width: 28px; height: 28px; }

/* ---------- preview ---------- */
.preview { display: flex; flex-direction: column; }
.stagebox { position: relative; padding: 24px 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; background: var(--chat-dark); color: var(--chat-dark-text); border-bottom: 1px solid var(--border); overflow: hidden; }
.stagebox.light { background: var(--chat-light); color: var(--chat-light-text); }
.stagebox.checker { background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 16px 16px; }
.pname { font-family: var(--name-font); font-weight: 700; line-height: 1.2; white-space: nowrap; max-width: 100%; }
canvas.pname { max-width: none; flex: none; }
.painted { background-color: currentcolor; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
canvas.pname { display: block; }
.chat { display: flex; flex-direction: column; gap: 2px; width: 100%; font-family: var(--name-font); font-size: 13px; line-height: 20px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, currentcolor 12%, transparent); }
.chat .msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat .ts { opacity: .6; margin-right: 6px; font-variant-numeric: tabular-nums; }
.chat .who { font-weight: 700; }
.chat canvas { display: inline-block; vertical-align: middle; }
.texrow { display: flex; align-items: center; gap: 10px; }
.tex { width: 100%; max-width: 100%; height: auto; border: 1px solid var(--border-strong); background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 12px 12px; image-rendering: pixelated; }
.transport { display: flex; align-items: center; gap: 8px; }
.transport input[type='range'] { flex: 1; }
.frameno { font: 600 .74rem var(--font-mono); color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 64px; text-align: right; }

/* ---------- code ---------- */
.code-wrap { border: 1px solid var(--border); background: var(--elevated-2); }
.code-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 10px; background: var(--surface); border-bottom: 1px solid var(--border); }
.code-head .seg { border: 0; padding: 0; background: none; }
.code-head .seg button { font-size: .74rem; }
pre.code, textarea.code { margin: 0; padding: 13px 15px; font: .78rem/1.65 var(--font-mono); max-height: 300px; overflow: auto; white-space: pre; tab-size: 2; color: var(--text); }
textarea.code { width: 100%; min-height: 220px; resize: vertical; background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius); outline: none; }
textarea.code:focus-visible { border-color: var(--focus-ring); box-shadow: 0 0 0 1px var(--focus-ring); }

.export-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.stat { font: 600 .78rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.result { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border); background: var(--bg); }
.result img { max-width: 50%; max-height: 64px; background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 10px 10px; border: 1px solid var(--border-strong); }

/* ---------- dialog ---------- */
.backdrop { position: fixed; inset: 0; z-index: var(--z-dialog); background: var(--overlay); display: grid; place-items: start center; padding: min(10vh, 72px) 12px 12px; animation: fade-in var(--fast) ease-out; }
@keyframes fade-in { from { opacity: 0; } }
.dialog { width: min(720px, 100%); max-height: calc(100vh - min(10vh, 72px) - 24px); display: flex; flex-direction: column; background: var(--elevated); border: 1px solid var(--border-strong); box-shadow: var(--shadow-dialog); animation: dlg-in var(--base) var(--ease); }
.dialog.wide { width: min(1040px, 100%); }
@keyframes dlg-in { from { opacity: 0; transform: scale(.97); } }
.dialog > header { display: flex; align-items: center; gap: 8px; padding: 10px 8px 8px 16px; border-bottom: 1px solid var(--border); }
.dialog > header h2 { flex: 1; font-size: 1.05rem; font-weight: 700; }
.dialog > .dbody { padding: 14px 16px; overflow: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px; }
.dialog > footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; width: 14px; height: 14px; margin-top: -7px; color: var(--dim); pointer-events: none; }
.search .field { padding-left: 30px; height: 34px; }
.libcat { display: flex; flex-direction: column; gap: 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 8px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 0; cursor: pointer; transition: border-color var(--fast), background-color var(--fast); }
.card:hover { border-color: var(--border-strong); background: var(--surface-hover); }
.card:active { transform: scale(.98); }
.card canvas, .card .sw { width: 100%; aspect-ratio: 4 / 1; display: block; border: 1px solid var(--border-strong); background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 8px 8px; }
.card b { font-size: .85rem; }
.card span { font-size: .76rem; color: var(--dim); line-height: 1.4; }

/* ---------- tooltip and toasts ---------- */
.tooltip { position: fixed; z-index: var(--z-tooltip); pointer-events: none; max-width: 260px; padding: 6px 9px; background: var(--elevated-2); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow-pop); font-size: .8rem; font-weight: 600; animation: tip-in var(--fast) ease-out; }
.tooltip.instant { animation: none; }
.tooltip small { display: block; font-size: .76rem; font-weight: 400; color: var(--muted); }
@keyframes tip-in { from { opacity: 0; transform: scale(.97); } }
.toasts { position: fixed; right: 18px; bottom: 18px; z-index: var(--z-toast); display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toasts.errors { right: auto; left: 18px; align-items: flex-start; }
.toast { position: relative; max-width: min(420px, calc(100vw - 36px)); padding: 12px 30px 14px 14px; background: var(--elevated); border: 1px solid var(--border-strong); border-left: 3px solid var(--border-strong); box-shadow: var(--shadow-pop); font-size: .85rem; overflow: hidden; overflow-wrap: anywhere; animation: toast-in var(--base) var(--ease); }
.toasts.errors .toast { animation-name: toast-in-left; }
@keyframes toast-in-left { from { opacity: 0; transform: translateX(-16px) scale(.98); } }
.toast.error { border-left-color: var(--red); }
.toast.success { border-left-color: var(--green); }
.toast .x { position: absolute; top: 6px; right: 6px; }
.toast .drain { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--border-strong); transform-origin: left; animation: drain 3.5s linear forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateX(16px) scale(.98); } }
@keyframes drain { to { transform: scaleX(0); } }

/* ---------- animated editor: lists | settings | stage ---------- */
.layout.anim { grid-template-columns: minmax(0, 1.45fr) minmax(360px, 1fr); }
.editor.anim { display: grid; grid-template-columns: minmax(280px, 330px) minmax(0, 1fr); gap: 16px; align-items: start; }
.editor .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.settings-col { position: sticky; top: 76px; max-height: calc(100vh - 92px); overflow: auto; scrollbar-gutter: stable; }
@media (max-width: 1360px) {
  .layout.anim { grid-template-columns: minmax(0, 1fr) minmax(340px, 0.9fr); }
  .editor.anim { grid-template-columns: minmax(0, 1fr); }
  .settings-col { position: static; max-height: none; overflow: visible; order: -1; }
}
@media (max-width: 1000px) { .layout.anim { grid-template-columns: minmax(0, 1fr); } }

/* drag handles and sorting */
.grip { display: grid; grid-template-columns: repeat(2, 3px); gap: 2px 3px; place-content: center; width: 24px; height: 28px; padding: 0; border: 0; border-radius: var(--radius-sm); background: none; cursor: grab; flex: none; touch-action: none; }
.grip i { width: 3px; height: 3px; border-radius: 50%; background: var(--dim); }
.grip i:nth-child(3) { grid-column: 1 / 3; justify-self: center; }
.grip:hover i { background: var(--text); }
.grip:active { cursor: grabbing; }
.sortable-item { transition: transform var(--fast) var(--ease), background-color var(--fast); }
.sortable-item.dragging { transition: none; position: relative; z-index: 5; background: var(--elevated); box-shadow: var(--shadow-pop); }
.sorting { user-select: none; }
.item .grip { margin-left: -4px; }
.rename { height: 26px; padding: 0 6px; flex: 1; min-width: 0; }
.shadow-row { grid-template-columns: auto repeat(3, minmax(0, 1fr)) auto; background: var(--surface); }
.shadow-row .color { grid-column: 2 / 5; }

/* collapsible groups */
.group { border-top: 1px solid var(--border); margin: 0 -14px; }
.group:last-child { margin-bottom: -14px; }
.ghead { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 38px; padding: 0 14px; border: 0; background: none; text-align: left; cursor: pointer; font-size: .8rem; font-weight: 700; transition: background-color var(--fast); }
.ghead:hover { background: var(--row-hover); }
.ghead svg { width: 14px; height: 14px; color: var(--dim); transform: rotate(-90deg); transition: transform var(--fast) var(--ease); }
.ghead[aria-expanded='true'] svg { transform: none; }
.ghead span:first-of-type { flex: 1; }
.ghead:focus-visible { outline-offset: -2px; }
.gcount { font: 600 .72rem var(--font-mono); color: var(--dim); font-variant-numeric: tabular-nums; }
.gbody { padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.gbody[hidden] { display: none; }
.qhint { display: inline-grid; place-items: center; width: 14px; height: 14px; margin-left: 6px; border: 1px solid var(--border-strong); border-radius: 50%; font-size: .6rem; color: var(--dim); text-transform: none; letter-spacing: 0; vertical-align: 1px; cursor: help; }
.drag-hint { display: flex; align-items: center; gap: 6px; }
.drag-hint svg { width: 14px; height: 14px; flex: none; }

/* weighted palette editor */
.paled { display: flex; flex-direction: column; gap: 10px; }
.pbar { height: 26px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: repeating-conic-gradient(var(--checker-a) 0 25%, var(--checker-b) 0 50%) 0 0 / 12px 12px; overflow: hidden; }
.pbar i { display: block; height: 100%; }
.plist { display: flex; flex-direction: column; border: 1px solid var(--border); }
.prow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; grid-template-areas: 'g c s a d' '. t t t t'; align-items: center; gap: 4px 8px; padding: 8px 6px; border-bottom: 1px solid var(--border); background: var(--surface); }
.prow:last-child { border-bottom: 0; }
.prow > .grip { grid-area: g; }
.prow > .color { grid-area: c; }
.prow > .share { grid-area: s; font: 600 .78rem var(--font-mono); color: var(--muted); min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.prow > .numwrap { grid-area: a; display: flex; align-items: center; gap: 4px; }
.prow > .numwrap .num { width: 48px; }
.prow > .icon-btn { grid-area: d; }
.pstr { grid-area: t; display: flex; align-items: center; gap: 10px; }
.pstr .label { flex: none; }

/* emoji quick picks */
.stack.tight { gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { min-width: 30px; height: 28px; padding: 0 6px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); cursor: pointer; font-size: 15px; line-height: 1; transition: border-color var(--fast); }
.chip:hover { border-color: var(--border-strong); }
.chip:active { transform: scale(.95); }

/* library */
.libwrap { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; align-items: start; }
.libnav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; }
.navitem { display: flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 8px; border: 0; border-radius: var(--radius); background: none; color: var(--muted); text-align: left; cursor: pointer; font-weight: 600; font-size: .82rem; }
.navitem span:first-child { flex: 1; }
.navitem:hover { background: var(--row-hover); color: var(--text); }
.navitem[aria-current='true'] { background: var(--accent-dim); color: var(--accent-text); }
@media (max-width: 640px) { .libwrap { grid-template-columns: minmax(0, 1fr); } .libnav { flex-direction: row; flex-wrap: wrap; position: static; } }

body.dropping::after { content: 'Drop images to add them as elements, or a .json paint to open it'; position: fixed; inset: 12px; z-index: var(--z-dialog); display: grid; place-items: center; border: 2px dashed var(--accent-border); background: var(--overlay); color: var(--text); font-weight: 700; pointer-events: none; }

.footer { border-top: 1px solid var(--border); color: var(--dim); font-size: var(--text-hint); }
.footer-in { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 16px; }

.spinner { width: 13px; height: 13px; border: 2px solid color-mix(in srgb, currentcolor 30%, transparent); border-top-color: currentcolor; border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
  .popover, .dialog, .toast, .tooltip { animation: fade-in var(--fast) ease-out !important; }
}
@media (max-width: 640px) {
  .topbar-in { flex-wrap: wrap; gap: 10px; }
  #presetsBtn .lbl { display: none; }
}

/* ---------- uitest fixes ---------- */
[hidden] { display: none !important; }
/* larger hit area for the 14 px stop handles without changing their look */
.handle::before { content: ''; position: absolute; inset: -2px -6px; }
/* file pickers are a styled label around an sr-only input */
label.btn:focus-within { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
/* instant press feedback on the remaining pressables */
.seg button:active, .option:active, .navitem:active, .ghead:active, .select > button:active, .item:active, .chip:active { opacity: .6; transition: none; }
/* touch: enlarge the small controls to the 32 px floor */
@media (pointer: coarse) {
  .icon-btn.sm { width: 32px; height: 32px; }
  .grip { width: 32px; height: 32px; }
  .num { height: 32px; }
  .seg button { height: 32px; }
  .handle::before { inset: -2px -10px; }
}
/* hover only where hover exists, so states don't stick after a tap */
@media (hover: none) {
  .btn.secondary:hover { background: var(--surface); }
  .btn.ghost:hover, .icon-btn:hover { background: transparent; color: var(--muted); }
  .btn.primary:hover { background: var(--accent); }
  .item:hover { background: none; box-shadow: none; }
  .item.sel:hover { background: var(--accent-dim); box-shadow: inset 3px 0 0 var(--accent); }
  .card:hover, .chip:hover { border-color: var(--border); }
  .card:hover { background: var(--surface); }
  .option:hover, .navitem:hover, .ghead:hover { background: none; }
}
/* phones: the header scrolls away instead of taking a quarter of the screen */
@media (max-width: 640px) {
  .topbar { position: static; }
  .stage, .settings-col { top: 12px; }
}
@media (prefers-reduced-motion: reduce) { .toast .drain { display: none; } }
/* Windows contrast themes: keep selected states visible */
@media (forced-colors: active) {
  .seg button[aria-checked='true'], .option[aria-selected='true'], .navitem[aria-current='true'], .icon-btn.active { outline: 2px solid Highlight; outline-offset: -2px; }
  .item.sel, .stoprow.sel { outline: 2px solid Highlight; outline-offset: -2px; }
  .handle.sel { outline: 2px solid Highlight; }
  .painted, canvas.pname, .tex, .pbar, .gbar, .swatch, .thumb, .card canvas, .card .sw { forced-color-adjust: none; }
}
.color { flex-wrap: wrap; }
.color > .ctl { min-width: 140px; }
/* collapsible panels */
.ptoggle { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 28px; padding: 0; border: 0; background: none; text-align: left; font: inherit; font-weight: 700; color: var(--text); cursor: pointer; border-radius: var(--radius-sm); }
.ptoggle span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptoggle svg { width: 14px; height: 14px; flex: none; color: var(--dim); transition: transform var(--fast) var(--ease); }
.ptoggle[aria-expanded='false'] svg { transform: rotate(-90deg); }
.ptoggle:focus-visible { outline-offset: 2px; }
.panel.collapsed > header { border-bottom: 0; }
.panel > .body > .stagebox:first-child { margin: -14px -14px 0; }

</style>

  <a class="skip" href="#editor">Skip to editor</a>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="https://cyex.app" aria-label="cyex home">
        <svg class="mark" viewBox="3 5 25 22" width="22" height="19" aria-hidden="true">

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script>
/* Shared helpers: maths, colour packing (7TV format), gradient lookup tables, noise. */
window.PL = window.PL || {};
(function (PL) {
  'use strict';
  const TAU = Math.PI * 2;
  const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  const fract = (x) => x - Math.floor(x);
  const mix = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const tri = (x) => 1 - Math.abs(fract(x) * 2 - 1); // 0..1..0 triangle wave
  const wrap = (i, n) => ((i % n) + n) % n;

  // ---- colour ----
  function hexToRgb(h) {
    h = String(h || '#000000').replace('#', '').trim();
    if (h.length === 3 || h.length === 4) h = h.split('').map((c) => c + c).join('');
    const n = parseInt(h.slice(0, 6), 16) || 0;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  const hex2 = (x) => Math.round(clamp(x, 0, 255)).toString(16).padStart(2, '0');
  const rgbToHex = (r, g, b) => '#' + hex2(r) + hex2(g) + hex2(b);

  // 7TV stores colours as a signed 32-bit int: (r << 24) | (g << 16) | (b << 8) | a
  const packRGBA = (r, g, b, a) => ((r & 255) << 24) | ((g & 255) << 16) | ((b & 255) << 8) | (a & 255);
  const unpackRGBA = (n) => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
  function decToCss(n) {
    const [r, g, b, a] = unpackRGBA(n);
    return `rgba(${r}, ${g}, ${b}, ${(a / 255).toFixed(3)})`;
  }
  const hexAlphaToDec = (hex, alpha) => { const [r, g, b] = hexToRgb(hex); return packRGBA(r, g, b, Math.round(clamp(alpha) * 255)); };
  const decToHexAlpha = (n) => { const [r, g, b, a] = unpackRGBA(n); return { hex: rgbToHex(r, g, b), alpha: a / 255 }; };

  function hsvToRgb(h, s, v) { // h 0..1, returns 0..1
    h = fract(h) * 6; const i = Math.floor(h), f = h - i;
    const p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
    switch (i % 6) { case 0: return [v, t, p]; case 1: return [q, v, p]; case 2: return [p, v, t]; case 3: return [p, q, v]; case 4: return [t, p, v]; default: return [v, p, q]; }
  }
  function rgbToHsl(r, g, b) {
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    if (mx === mn) return [0, 0, l];

  <script>
/* Scene elements: objects you place, copy and animate (shapes, text and emoji, pictures, ribbons,
   mountains, a city skyline, lightning). They draw with the 2D canvas API: draw(ctx, t, p, c).
   Shared blocks: Colours, Placement, Motion, Copies, Glow and outline. All motion loops seamlessly. */
(function (PL) {
  'use strict';

  // ---------- shared parameter blocks ----------

    G('Colours', P.select('fill', 'Fill', [['gradient', 'Gradient'], ['radial', 'Radial gradient'], ['mixed', 'One colour per copy'], ['solid', 'First colour only']], o.fill ?? 'gradient')),

  ];

    G('Placement', P.range('x', 'X', -0.25, 1.25, 0.01, o.x ?? 0.5)),
    G('Placement', P.range('y', 'Y', -0.25, 1.25, 0.01, o.y ?? 0.5)),
    G('Placement', P.range('size', 'Size', 0.05, 2.5, 0.01, o.size ?? 0.6, 'Height of the element, relative to the paint')),
    G('Placement', P.range('stretch', 'Stretch', 0.2, 5, 0.05, o.stretch ?? 1)),
    G('Placement', P.range('rot', 'Rotation', -180, 180, 1, o.rot ?? 0)),
  ];
  const MOTIONS = [['none', 'Stay still'], ['float', 'Float'], ['bounce', 'Bounce'], ['sway', 'Sway'], ['orbit', 'Orbit'], ['figure8', 'Figure eight'], ['wander', 'Wander'], ['driftR', 'Drift right'], ['driftL', 'Drift left'], ['rise', 'Rise'], ['fall', 'Fall'], ['path', 'Move from A to B']];

    G('Motion', P.select('motion', 'Movement', MOTIONS, o.motion ?? 'float')),

  function renderStaticEditor(root) {

    const isUrl = p.function === 'URL';
    const typeCtl = seg([['LINEAR_GRADIENT', 'Linear'], ['RADIAL_GRADIENT', 'Radial'], ['URL', 'Image URL']], p.function, (v) => { p.function = v; renderEditor(); changed(true); }, 'Function');

    if (p.function === 'LINEAR_GRADIENT') paintBody.push(slider('Angle', p.angle, { min: 0, max: 360, step: 1, unit: '°', onInput: (v) => { p.angle = v; changed(false); }, onCommit: () => commit() }));
    if (p.function === 'RADIAL_GRADIENT') paintBody.push(labeled('Shape', seg([['circle', 'Circle'], ['ellipse', 'Ellipse']], p.shape, (v) => { p.shape = v; changed(true); }, 'Shape')));

    if (isUrl) {

    }
    root.append(panel('Paint', paintBody));
    if (!isUrl) {
      const es = Paint.editorStops(p);
      const ed = stopsEditor(es, (stops, c) => {
        p.stops = stops.map((s) => ({ at: Math.round(s.at * 10000) / 10000, color: PL.hexAlphaToDec(s.color, s.a) }));
        changed(c);
      }, { palettes: true });

  const SIZES = [36, 24, 18];
  const CHAT = [['14:02', 'quietoak', '#1e90ff', 'that paint is clean'], ['14:02', null, null, 'thanks, made it myself'], ['14:03', 'nora_byte', '#9acd32', 'how long did the animation take']];
  function previewPanel(kind) {
    const pv = state.preview;
    const text = h('input', { class: 'field', value: pv.text, maxlength: 25, 'aria-label': 'Preview name', oninput: () => { pv.text = text.value || ' '; refreshPreview(); save(); } });
    const color = colorField(pv.color, null, (hx) => { pv.color = hx; refreshPreview(); save(); }, { label: 'Name colour' });
    const bg = seg([['dark', 'Dark chat'], ['light', 'Light chat'], ['checker', 'Transparent']], pv.bg, (v) => { pv.bg = v; box.className = 'stagebox ' + v; save(); }, 'Backdrop');
    const box = h('div', { class: 'stagebox ' + pv.bg, id: 'stagebox' });
    const ctl = h('div', { class: 'split' }, labeled('Preview name', text), labeled('Name colour', color));
    const body = [ctl, h('p', { class: 'hint' }, 'The name colour shows through any transparent part of the paint, as it does in 7TV.'), h('div', { class: 'row' }, bg)];

  let pv = null; // current preview handles
  function refreshPreview() { if (state.mode === 'static') updateStaticPreview(); else rt.redraw = true; }

  function updateStaticPreview() {
    if (!pv || state.mode !== 'static') return;
    const p = state.static, st = Paint.styleFor(p);
    for (const el of [...pv.names, ...pv.chatNames]) {
      el.textContent = state.preview.text;
      el.style.color = state.preview.color;
      el.style.backgroundImage = st.backgroundImage;
      el.style.backgroundSize = st.backgroundSize;
      el.style.filter = st.filter;

  }

  // =====================================================================================
  // Output panel (code + exports)

  let outputGetter = null;

    const readSize = () => { state.texSize = [Math.max(1, Math.min(4096, parseInt(tw.value) || 256)), Math.max(1, Math.min(2048, parseInt(th.value) || 64))]; tw.value = state.texSize[0]; th.value = state.texSize[1]; save(); return state.texSize; };

    const toAnim = btn('Animate this paint', () => { state.anim = staticToAnim(state.static); state.mode = 'anim'; state.sel = state.anim.layers[0] ? { kind: 'layer', id: state.anim.layers[0].id } : null; renderAll(); commit(); toast('Copied into the animated editor as a layer.', 'success'); }, 'primary', 'wand');
    return panel('Export', [

      h('div', { class: 'sub' }, h('span', { class: 'label' }, 'Images'),
        h('div', { class: 'row' }, h('span', { class: 'hint' }, 'Paint size'), tw, h('span', { class: 'unit' }, '×'), th, h('span', { class: 'unit' }, 'px')),
        nsz, h('div', { class: 'row' }, pngTex, pngName)),
      h('div', { class: 'sub' }, h('span', { class: 'label' }, 'Animate'), h('p', { class: 'hint' }, 'Turns this gradient into a layer you can move, then add effects, sparkles or materials on top.'), h('div', null, toAnim)),
    ]);
  }

  function loadImage(src) {
    return new Promise((res, rej) => {
      const im = new Image(); im.crossOrigin = 'anonymous';
      im.onload = () => res(im); im.onerror = () => rej(new Error('Could not load that image. The host may block cross-origin use.'));
      im.src = src;
    });
  }
  async function staticTexture(p, w, hh) {
    const cv = h('canvas', { width: w, height: hh });
    const ctx = cv.getContext('2d');
    if (p.function === 'URL') {
      if (!p.image_url) throw new Error('Add an image URL first.');
      const safe = Paint.safeUrl(p.image_url);
      if (!safe) throw new Error('Add an http or https image link first.');
      const im = await loadImage(safe);
      ctx.drawImage(im, 0, 0, w, hh);
      try { ctx.getImageData(0, 0, 1, 1); } catch (e) { throw new Error('That host blocks reading the image, so it can only be previewed, not exported.'); }
    } else ctx.putImageData(Paint.rasterize(p, w, hh), 0, 0);
    return cv;
  }
  async function staticNameCanvas(px) {
    const p = state.static, m = measure(state.preview.text, px), pad = shadowPad(p.shadows);
    const tex = await staticTexture(p, m.w, m.h); // CSS gradients are laid out on the name box itself
    const cv = h('canvas', { width: m.w + pad * 2, height: m.h + pad * 2 });
    paintName(cv.getContext('2d'), pad, pad, state.preview.text, px, tex, state.preview.color, p.shadows, 1);
    return cv;
  }

  function openImport() {
    const ta = h('textarea', { class: 'code', spellcheck: false, placeholder: '{ "name": "Unnamed Paint", "function": "LINEAR_GRADIENT", … }', 'aria-label': 'Paint JSON' });
    const file = h('input', { type: 'file', accept: '.json,application/json', class: 'sr-only', onchange: async () => { if (file.files[0]) ta.value = await file.files[0].text(); } });
    const d = dialog('Import a paint', [
      h('p', { class: 'hint' }, 'Paste 7TV paint JSON. Colours can be 7TV integers or hex strings. Animated project files open in the Animated tab.'),
      ta, h('label', { class: 'btn secondary small', style: { alignSelf: 'flex-start' } }, icon('folder'), 'Open file', file),
    ], {
      footer: [btn('Cancel', () => d.close(), 'secondary'), btn('Import', () => {
        try {
          const obj = JSON.parse(ta.value);
          const msg = loadJson(obj);
          d.close(); renderAll(); commit(); toast(msg, "success");
        } catch (e) { toast("Couldn’t read that JSON. Check it’s a 7TV paint or a cyex paints project.", "error"); console.warn(e); }
      }, 'primary')],
    });
  }

  function staticToAnim(p) {
    const doc = E.blankDoc();
    doc.name = p.name; doc.shadows = clone(p.shadows);
    if (p.function === 'URL') return doc;
    let stops = Paint.editorStops(p), count = 1;
    if (p.repeat && stops.length > 1) {
      const f = stops[0].at, l = stops[stops.length - 1].at;
      if (l - f > 0) { count = Math.round((1 / (l - f)) * 4) / 4 || 1; stops = stops.map((s) => Object.assign({}, s, { at: (s.at - f) / (l - f) })); }
    }
    doc.layers.push(p.function === 'RADIAL_GRADIENT'
      ? E.newLayer('radial', { params: { stops, count, speed: 0, circle: p.shape === 'circle' } })
      : E.newLayer('linear', { params: { stops, angle: p.angle, count, speed: 0 } }));
    return doc;
  }

  // =====================================================================================
  // Animated editor
  // =====================================================================================
  const rt = { cp: null, cache: [], dirty: true, playing: !matchMedia('(prefers-reduced-motion: reduce)').matches, frame: 0, start: performance.now(), shown: -1, redraw: true, texCv: null, ui: null };
  const FPS = [[10, '10'], [20, '20'], [25, '25'], [33, '33'], [50, '50']];

  const findSel = () => {
    const s = state.sel; if (!s) return null;
    const list = s.kind === 'layer' ? state.anim.layers : state.anim.effects;
    const item = list.find((x) => x.id === s.id);
    return item ? { kind: s.kind, item, list } : null;
  };

  function renderAnimEditor(root) {
    const d = state.anim;
    if (!findSel()) state.sel = d.layers.length ? { kind: 'layer', id: d.layers[d.layers.length - 1].id } : d.effects.length ? { kind: 'effect', id: d.effects[0].id } : null;
    root.classList.add('anim');
    const colA = h('div', { class: 'col' }), colB = h('div', { class: 'col settings-col' });
    root.append(colA, colB);

    // layers list (top layer first)
    const layerList = h('div', { class: 'list', role: 'list', 'aria-label': 'Layers, top first' });
    const items = [...d.layers].reverse();
    if (!items.length) layerList.append(h('div', { class: 'empty' }, icon('layers'), h('span', null, 'No layers yet. Add one, pick a preset, or drop an image here.')));
    for (const l of items) layerList.append(listItem(l, 'layer', d.layers));
    sortable(layerList, (from, to, kb) => {
      const n = d.layers.length, a = n - 1 - from, b = n - 1 - to;
      const [it] = d.layers.splice(a, 1); d.layers.splice(b, 0, it);

    colA.append(panel('Layers', [layerList, h('div', { class: 'row' },
      btn('Add layer', () => openLibrary('layer'), 'secondary small', 'plus'),
      btn('Add element', () => openLibrary('layer', 'Scene elements'), 'ghost small', 'sparkles'))], [], { count: d.layers.length }));

    const fxList = h('div', { class: 'list', role: 'list', 'aria-label': 'Effects, applied top to bottom' });
    if (!d.effects.length) fxList.append(h('div', { class: 'empty' }, icon('fx'), h('span', null, 'Effects run on the finished image, top to bottom: lighting, 3D, distortion, colour.')));
    for (const e of d.effects) fxList.append(listItem(e, 'effect', d.effects));
    sortable(fxList, (from, to, kb) => {
      const [it] = d.effects.splice(from, 1); d.effects.splice(to, 0, it);

    colA.append(paintPanel(d));

    const s = findSel();

    setInfo();
    const wIn = h('input', { class: 'num', value: d.width, 'aria-label': 'Width (px)' }), hIn = h('input', { class: 'num', value: d.height, 'aria-label': 'Height (px)' });

    wIn.onchange = size; hIn.onchange = size;
    const sizePresets = seg([['256x64', '256×64'], ['320x64', '320×64'], ['384x96', '384×96'], ['512x128', '512×128']], `${d.width}x${d.height}`, (v) => { const [a, b] = v.split('x').map(Number); d.width = a; d.height = b; wIn.value = a; hIn.value = b; changed(true); scheduleThumbs(true); }, 'Size presets');

    return [

  function listItem(item, kind, list) {
    const isSel = state.sel && state.sel.id === item.id;
    const def = kind === 'layer' ? PL.LAYERS[item.type] : PL.EFFECTS[item.type];
    const thumb = h('canvas', { class: 'thumb', width: 88, height: 22, 'data-thumb': item.id, 'aria-hidden': 'true' });
    const idx = list.indexOf(item);
    const select_ = () => { if (!(state.sel && state.sel.id === item.id)) { state.sel = { kind, id: item.id }; renderEditor(); } };
    const nameEl = h('span', { class: 'name', title: 'Double-click to rename' }, item.name || def.name);
    nameEl.addEventListener('dblclick', () => {
      const inp = h('input', { class: 'field rename', value: item.name || def.name, maxlength: 64, 'aria-label': 'Rename' });
      let finished = false;
      const done = (ok) => { if (finished) return; finished = true; if (ok && inp.value.trim()) { item.name = inp.value.trim(); changed(true); } renderEditor(); focusItem(item.id); };
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); e.stopPropagation(); });
      inp.addEventListener('blur', () => done(true));
      nameEl.replaceWith(inp); inp.focus(); inp.select();
    });
    const meta = [];
    if (kind === 'layer' && item.blend !== 'normal') meta.push((PL.BLENDS.find((b) => b[0] === item.blend) || [, ''])[1].split(' (')[0]);
    if (kind === 'layer' && item.opacity < 1) meta.push(Math.round(item.opacity * 100) + '%');
    const el = h('div', {
      class: 'item sortable-item' + (isSel ? ' sel' : '') + (item.visible ? '' : ' off'), role: 'listitem', 'data-id': item.id, tabindex: '0', 'aria-current': isSel ? 'true' : null,
      onclick: (e) => { if (e.target.closest('button, input')) return; select_(); },
      onkeydown: (e) => {
        if (e.target !== el) return;
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select_(); $('#editor [data-sel-first]')?.focus(); }
        if (e.key === 'Delete') { e.preventDefault(); remove(); }
      },
    },
    grip(`Move ${item.name || def.name}`), thumb, nameEl,
    meta.length ? h('span', { class: 'meta' }, meta.join(' · ')) : null,

    return el;
  }

  function paramControl(pd, params, onInput, onCommit) {
    const v = params[pd.k];
    switch (pd.t) {
      case 'range': {
        const sl = slider(pd.l, v, { min: pd.min, max: pd.max, step: pd.step, hint: pd.hint, onInput: (x) => { params[pd.k] = x; onInput(); }, onCommit });
        if (pd.hint) sl.querySelector('.label').append(h('span', { class: 'qhint', 'data-tip': pd.hint, tabindex: '-1' }, '?'));
        if (pd.k === 'seed') sl.querySelector('.top').append(iconBtn('dice', 'New random seed', () => { params.seed = 1 + Math.floor(Math.random() * 999); sl.set(params.seed); onCommit(); }, { cls: 'sm' }));
        return sl;
      }
      case 'color': return labeled(pd.l, colorField(v, null, (hx, a, c) => { params[pd.k] = hx; c ? onCommit() : onInput(); }, { label: pd.l }));
      case 'select': return labeled(pd.l, select(pd.o, v, (x) => { params[pd.k] = x; onCommit(); }, pd.l));
      case 'bool': return checkbox(pd.l, !!v, (x) => { params[pd.k] = x; onCommit(); });
      case 'text': {
        const inp = h('input', { class: 'field', value: v, maxlength: 60, 'aria-label': pd.l, oninput: () => { params[pd.k] = inp.value; onInput(); }, onchange: onCommit });
        const quick = h('div', { class: 'chips' }, ['❄', '🌸', '⭐', '♥', '✦', '🔥', '✨', '💜', '☾', '⚡', '🎵', '👑', '🍀', '🦋', '💎', '☁'].map((ch) => h('button', { type: 'button', class: 'chip', 'aria-label': 'Use ' + ch, onclick: () => { params[pd.k] = ch; inp.value = ch; onCommit(); } }, ch)));
        return labeled(pd.l, h('div', { class: 'stack tight' }, inp, quick));
      }
      case 'stops': return labeled(pd.l, stopsEditor(params[pd.k], (s, c) => { c ? onCommit() : onInput(); }, { palettes: true }));
      case 'palette': return paletteEditor(params[pd.k], (pal, c) => { c ? onCommit() : onInput(); });
      case 'image': {

  const GROUP_ORDER = ['Colours', 'Shape', 'Settings', 'Placement', 'Motion', 'Copies', 'Glow and outline'];
  const groupOf = (pd) => pd.g || (pd.t === 'palette' || pd.t === 'stops' || pd.t === 'color' ? 'Colours' : 'Settings');
  const visibleKeys = (def, params) => def.params.filter((pd) => !pd.show || pd.show(params)).map((pd) => pd.k).join(',');

  function settingsPanel(s) {

          slider('Scroll y', xf.sy, { min: -8, max: 8, step: 1, hint: 'Full heights per loop', onInput: (v) => { xf.sy = v; onInput(); }, onCommit }),

        h('p', { class: 'hint' }, 'Moves the whole layer. Scroll and spin use whole numbers so the loop stays seamless.')]));
      item.tweak = Object.assign({}, E.DEFAULT_TWEAK, item.tweak || {});

    }

    const reset = iconBtn('reset', 'Reset to defaults', () => { item.params = E.defaults(def); if (item.xf) item.xf = Object.assign({}, E.DEFAULT_XF); if (item.tweak) item.tweak = Object.assign({}, E.DEFAULT_TWEAK); renderEditor(); changed(true); }, { cls: 'sm' });
    const dup = iconBtn('dup', 'Duplicate', () => { const list = s.list, c = clone(item); c.id = PL.uid(kind[0]); list.splice(list.indexOf(item) + 1, 0, c); state.sel = { kind, id: c.id }; renderEditor(); changed(true); }, { cls: 'sm' });

  }

  function fileToDataUrl(file, max) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = async () => {
        try {
          const im = await loadImage(r.result);
          const k = Math.min(1, max / Math.max(im.width, im.height));
          const cv = h('canvas', { width: Math.max(1, Math.round(im.width * k)), height: Math.max(1, Math.round(im.height * k)) });
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);

  }
  async function cacheImage(src) {
    if (!src || PL.imageCache[src]) return;

    const cv = h('canvas', { width: im.width, height: im.height }), ctx = cv.getContext('2d');

  }
  async function cacheDocImages(doc) {
    const srcs = doc.layers.filter((l) => l.type === 'image' && l.params.src).map((l) => l.params.src);
    await Promise.all(srcs.map((s) => cacheImage(s).catch(() => {})));
    if (srcs.length) { rt.dirty = true; scheduleThumbs(true); }
  }

  // ---- thumbnails ----
  let thumbTimer = 0;
  function scheduleThumbs(now) { clearTimeout(thumbTimer); thumbTimer = setTimeout(drawThumbs, now ? 0 : 250); }
  function drawThumbs() {
    if (state.mode !== 'anim') return;
    const d = state.anim, t = 0.15;
    for (const cv of document.querySelectorAll('[data-thumb]')) {
      const id = cv.dataset.thumb;
      const l = d.layers.find((x) => x.id === id), e = d.effects.find((x) => x.id === id);
      let mini;
      if (l) mini = Object.assign({}, d, { layers: [Object.assign({}, l, { visible: true, opacity: 1, blend: 'normal' })], effects: [] });
      else if (e) mini = Object.assign({}, d, { effects: [Object.assign({}, e, { visible: true })] });
      else continue;
      const cp = E.compile(mini);
      // render at the paint's aspect, then letterbox into the thumb
      const W = 88, H = Math.max(4, Math.round(88 / (d.width / d.height)));

      const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.drawImage(tmp, 0, 0, cv.width, cv.height); // stretched, the way 7TV stretches it over a name
    }
  }

  // ---- animated preview + playback ----
  function animStage(root) {
    const p = previewPanel('anim');
    pv = p;
    const d = state.anim;
    rt.texCv = h('canvas', { class: 'tex', width: d.width, height: d.height, 'aria-label': 'Paint image, current frame', role: 'img' });
    const playB = iconBtn(rt.playing ? 'pause' : 'play', rt.playing ? 'Pause' : 'Play', togglePlay, { attrs: { 'data-hint': 'Space' } });
    const scrub = h('input', { type: 'range', min: 0, max: E.frameCount(d) - 1, step: 1, value: 0, 'aria-label': 'Frame' });
    scrub.addEventListener('input', () => { rt.playing = false; setPlayIcon(); rt.frame = +scrub.value; rt.redraw = true; });
    const fno = h('span', { class: 'frameno' });
    p.el.querySelector('.body').append(h('div', { class: 'sub' }, h('span', { class: 'label' }, 'Paint image'), rt.texCv, h('div', { class: 'transport' }, playB, scrub, fno)));
    rt.ui = { playB, scrub, fno };

    rt.redraw = true; rt.dirty = true;
    enableCanvasDrag(rt.texCv, (cv, e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; });
    pv.names.forEach((cv) => enableCanvasDrag(cv, (c, e) => {
      // the name canvas has shadow padding around the text box the paint is stretched over
      const r = c.getBoundingClientRect(), pad = shadowPad(state.anim.shadows);

    }));
  }

  // Drag on the paint image (or a big preview name) to place the selected element or centre point.
  function dragTarget() {
    const s = findSel(); if (!s) return null;
    const def = s.kind === 'layer' ? PL.LAYERS[s.item.type] : PL.EFFECTS[s.item.type];
    // only real positions: x/y on elements, and cx/cy where they mean a centre (Checker and Cells use cx/cy for columns and rows)
    const byKey = Object.fromEntries(def.params.map((p) => [p.k, p]));
    if (byKey.x && byKey.y) return { p: s.item.params, kx: 'x', ky: 'y', bx: 'toX', by: 'toY' };
    if (byKey.cx && byKey.cy && /^Centre/.test(byKey.cx.l)) return { p: s.item.params, kx: 'cx', ky: 'cy' };
    return null;
  }
  function enableCanvasDrag(cv, toUV) {
    cv.addEventListener('pointerenter', () => { cv.style.cursor = dragTarget() ? 'move' : ''; });
    cv.addEventListener('pointerdown', (e) => {
      const tg = dragTarget();
      if (!tg || e.button !== 0) return;
      e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      const useB = e.shiftKey && tg.bx && tg.p.motion === 'path';
      const kx = useB ? tg.bx : tg.kx, ky = useB ? tg.by : tg.ky;
      const set = (ev) => {
        const [u, v] = toUV(cv, ev);
        tg.p[kx] = Math.round(PL.clamp(u, -0.25, 1.25) * 100) / 100; tg.p[ky] = Math.round(PL.clamp(v, -0.25, 1.25) * 100) / 100;
        changed(false);
      };
      set(e);
      const up = () => { cv.removeEventListener('pointermove', set); cv.removeEventListener('pointerup', up); cv.removeEventListener('pointercancel', up); const old = $('#settingsPanel'), s = findSel(); if (old && s) old.replaceWith(settingsPanel(s)); changed(true); };
      cv.addEventListener('pointermove', set); cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    });
  }

  // Drop image files anywhere: they become Picture elements (animated mode) or open as a layer.
  document.addEventListener('dragover', (e) => { if ([...(e.dataTransfer?.items || [])].some((i) => i.kind === 'file')) { e.preventDefault(); document.body.classList.add('dropping'); } });
  document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('dropping'); });
  document.addEventListener('drop', async (e) => {
    document.body.classList.remove('dropping');
    const files = [...(e.dataTransfer?.files || [])];
    if (!files.length) return;
    e.preventDefault();
    const json = files.find((f) => /json$/i.test(f.name) || f.type === 'application/json');
    if (json) {
      try {
        const obj = JSON.parse(await json.text());
        const msg = loadJson(obj);
        renderAll(); commit(); toast(msg, "success");
      } catch (err) { toast("Couldn’t open " + json.name + ". Check it’s a paint or project file.", "error"); console.warn(err); }
      return;
    }
    const imgs = files.filter((f) => f.type.startsWith('image/'));
    if (!imgs.length) return;
    if (state.mode !== 'anim') { state.mode = 'anim'; }
    for (const f of imgs) {
      try {
        const src = await fileToDataUrl(f, 512); await cacheImage(src);
        const l = E.newLayer('sprite', { name: f.name.replace(/\.[^.]+$/, '').slice(0, 30), params: { src } });
        state.anim.layers.push(l); state.sel = { kind: 'layer', id: l.id };
      } catch (err) { toast('Could not read ' + f.name + '.', 'error'); }
    }
    renderAll(); commit(); toast(imgs.length > 1 ? `Added ${imgs.length} pictures.` : 'Added the picture as an element. Drag it on the paint image to place it.', 'success');
  });
  function setPlayIcon() { if (!rt.ui) return; const b = rt.ui.playB; b.replaceChildren(icon(rt.playing ? 'pause' : 'play')); b.setAttribute('aria-label', rt.playing ? 'Pause' : 'Play'); b.dataset.tip = rt.playing ? 'Pause' : 'Play'; }

  function getFrame(i) {
    // cache frames only while the whole loop fits in ~160 MB; above that, render each frame on demand
    if (rt.cache[i]) return rt.cache[i];

  }
  // The preview loop never throws: a failing layer shows one error and waits for the next edit.
  function tick(now) {
    requestAnimationFrame(tick);

    if (document.querySelector('.backdrop')) return; // a dialog covers the preview
    try { step(now); rt.broken = false; }
    catch (e) { console.error(e); rt.broken = true; rt.dirty = false; toast('Couldn’t draw this paint. Undo the last change or remove the layer that broke it.', 'error'); }
  }
  function step(now) {
    const d = state.anim;
    if (rt.dirty) {
      rt.cp = E.compile(d); rt.cache = []; rt.dirty = false; rt.redraw = true;
      if (rt.texCv.width !== d.width || rt.texCv.height !== d.height) { rt.texCv.width = d.width; rt.texCv.height = d.height; }

    const text = state.preview.text, color = state.preview.color;
    pv.names.forEach((cv, i) => drawNameCanvas(cv, text, SIZES[i], rt.texCv, color, d.shadows));
    pv.chatNames.forEach((cv) => drawNameCanvas(cv, text, 13, rt.texCv, color, d.shadows));
    rt.ui.scrub.value = rt.frame;

  // ---- animated export ----
  let lastExport = null, exporting = null;
  const setExport = (rec) => { if (lastExport && lastExport.url) URL.revokeObjectURL(lastExport.url); lastExport = rec; };
  function animOutput() {
    const d = state.anim, g = state.gif;
    const result = h('div', { class: 'stack', id: 'exportResult' });
    if (lastExport) showResult(result, lastExport);
    const exportBtns = [];
    const cancelB = btn('Cancel', () => { if (exporting) exporting.cancel = true; }, 'ghost small', 'x');
    cancelB.hidden = true;

    // Every export works on a snapshot of the paint taken when it starts, so editing meanwhile
    // can't mix frames. Only one export runs at a time, and it can be cancelled.
    async function runExport(b, work) {
      if (exporting) return;
      const doc = clone(state.anim);
      if (!doc.layers.some((l) => l.visible)) { toast('There is nothing to export yet. Add or show a layer first.'); return; }
      const cp = E.compile(doc);
      const px = cp.W * cp.H * cp.frames;
      if (px > 12e6 && !(await confirmHeavy(cp))) return;
      exporting = { cancel: false };
      const job = exporting;
      const old = [...b.childNodes];
      exportBtns.forEach((x) => (x.disabled = true));
      b.replaceChildren(h('span', { class: 'spinner' }), h('span', null, 'Rendering…'));
      cancelB.hidden = false;
      const update = (txt) => { b.lastChild.textContent = txt; };
      const frames = async () => {
        const out = [];
        for (let i = 0; i < cp.frames; i++) {
          if (job.cancel) throw new Error('cancelled');
          out.push(E.renderFrame(cp, i));
          update(`Rendering ${i + 1} / ${cp.frames}`);
          await new Promise((r) => setTimeout(r));
        }
        if (job.cancel) throw new Error('cancelled');
        update('Encoding…'); await new Promise((r) => setTimeout(r, 20));

      };

      catch (e) { if (e.message === 'cancelled') toast('Export cancelled.'); else { console.error(e); toast('Couldn’t finish the export. Try a smaller size or a shorter loop.', 'error'); } }
      finally {
        exporting = null;
        exportBtns.forEach((x) => (x.disabled = false));

      }
    }
    function confirmHeavy(cp) {
      return new Promise((resolve) => {
        let answered = false;
        const finish = (v) => { if (answered) return; answered = true; resolve(v); dlg.close(); };
        const dlg = dialog('This is a big export', [h('p', null, `It renders ${PL.fmtInt(cp.frames)} frames at ${cp.W}×${cp.H}, which can take a minute and use a lot of memory. A smaller size, fewer frames per second or a shorter loop make it faster.`)], {
          footer: [btn('Cancel', () => finish(false), 'secondary'), btn('Export anyway', () => finish(true), 'primary')],
          onClose: () => { if (!answered) { answered = true; resolve(false); } },
        });
      });
    }
    const finishExport = (rec) => { setExport(rec); showResult(result, rec); download(rec.blob, rec.name); };

    const gifB = btn('Export GIF', () => runExport(gifB, async ({ doc, cp, frames }) => {
      const fr = await frames();
      const blob = PL.Encode.encodeGif(fr, { delayCs: Math.round(100 / doc.fps), colors: g.colors, dither: g.dither, alphaCut: g.alpha ? 128 : 0, matte: g.alpha ? null : PL.hexToRgb(state.preview.color) });
      finishExport({ blob, name: slug(doc.name) + '.gif', kind: 'GIF', w: cp.W, h: cp.H, frames: fr.length, shadows: doc.shadows });
    }), 'primary', 'film');
    const apngB = btn('Export APNG', () => runExport(apngB, async ({ doc, cp, frames }) => {
      if (!window.CompressionStream) { toast('This browser can’t make APNG files. Use a current Chrome, Edge or Firefox.', 'error'); return; }
      const fr = await frames();
      const blob = await PL.Encode.encodeApng(fr, { delayMs: 1000 / doc.fps });
      finishExport({ blob, name: slug(doc.name) + '.png', kind: 'APNG', w: cp.W, h: cp.H, frames: fr.length, shadows: doc.shadows });
    }), 'secondary', 'film');
    const pngB = btn('Frame PNG', () => { if (!rt.texCv) return; rt.texCv.toBlob((b) => download(b, `${slug(d.name)}-frame-${rt.frame + 1}.png`)); }, 'secondary', 'image');
    const sheetB = btn('Sprite sheet', () => runExport(sheetB, async ({ doc, cp, frames }) => {
      const fr = await frames();
      // a grid, so tall loops stay under the browser's canvas size limit
      const cols = Math.max(1, Math.min(fr.length, Math.floor(16384 / cp.W))), rows = Math.ceil(fr.length / cols);
